{% extends 'base.html' %}

{% block content %}

<section class="dashboard-section">


<div class="menu-form">

<h2>Edit Menu Item</h2>


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


<input type="text"
name="name"
value="{{ item.name }}"
required>


<input type="text"
name="category"
value="{{ item.category }}"
required>


<textarea name="description">{{ item.description }}</textarea>


<input type="number"
name="price"
value="{{ item.price }}"
required>


<label class="file-label">
Current Image
</label>

<img src="{{ item.image.url }}" width="120">


<input type="file"
name="image">



<button type="submit">
Update Item
</button>


</form>


</div>


</section>


{% endblock %}
