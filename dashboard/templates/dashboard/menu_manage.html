{% extends 'base.html' %}

{% block content %}

<section class="dashboard-section">

    <div class="dashboard-header">

        <div>
            <h1>Manage Menu</h1>
            <p>Add, Edit and Delete Food Items</p>
        </div>

        <a href="{% url 'add_menu_item' %}" class="register-btn">Add Item</a>

    </div>


    <div class="dashboard-table">

        <table>

            <thead>

                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>

            </thead>


            <tbody>


            {% for item in menu_items %}

                <tr>

                    <td>
                        <img src="{{ item.image.url }}" 
                        width="70">
                    </td>


                    <td>
                        {{ item.name }}
                    </td>


                    <td>
                        {{ item.category }}
                    </td>


                    <td>
                        ₹{{ item.price }}
                    </td>


                    <td>

                        <a href="{% url 'edit_menu_item' item.id %}" class="edit-btn">Edit</a>


                        <a href="{% url 'delete_menu_item' item.id %}" class="delete-btn" onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>

                    </td>


                </tr>


            {% empty %}

                <tr>

                    <td colspan="5">
                        No menu items found
                    </td>

                </tr>


            {% endfor %}


            </tbody>


        </table>

    </div>


</section>


{% endblock %}
