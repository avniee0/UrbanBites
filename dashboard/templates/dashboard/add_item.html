{% extends 'base.html' %}

{% block content %}

<section class="dashboard-section">

    <div class="section-title">
        <h1>Add Menu Item</h1>
        <p>Create a new food item for UrbanBites</p>
    </div>


    <div class="menu-form">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <input type="text" 
                   name="name" 
                   placeholder="Food Name" 
                   required>


            <input type="text" 
                   name="category" 
                   placeholder="Category (Pizza, Burger, Pasta)" 
                   required>


            <textarea 
                name="description" 
                placeholder="Food Description">
            </textarea>


            <input type="number" 
                   name="price" 
                   placeholder="Price ₹" 
                   required>


            <label class="file-label">
                Upload Food Image
            </label>

            <input type="file" 
                   name="image" 
                   required>


            <button type="submit">
                Add Item
            </button>


        </form>

    </div>


</section>


{% endblock %}
