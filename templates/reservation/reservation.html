{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="reservation-image">
    <img src="{% static 'images/reservation.jpg' %}" alt="Reservation">
</div>

<div class="reservation-form">

    <h2>Reserve a Table</h2>

    <form>

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email Address" required>

        <input type="tel" placeholder="Phone Number" required>

        <input type="number" placeholder="Number of Guests" min="1" required>

        <label class="form-label">Select Date</label>
        <input type="date" name="date" required>

        <label class="form-label">Select Time</label>
        <input type="time" name="time" required>

        <textarea rows="5" placeholder="Special Request (Optional)"></textarea>

        <button type="submit">Reserve Now</button>

    </form>

</div>

<h2>Opening Hours</h2>

<div class="hours-box">
    <p><strong>Monday - Friday</strong></p>
    <p>10:00 AM - 10:00 PM</p>

    <br>

    <p><strong>Saturday - Sunday</strong></p>
    <p>10:00 AM - 11:30 PM</p>
</div>

{% endblock %}
